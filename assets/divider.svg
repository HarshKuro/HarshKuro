<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/><stop offset=".25" stop-color="#ff2a6d"/><stop offset=".75" stop-color="#05d9e8"/><stop offset="1" stop-color="#05d9e8" stop-opacity="0"/></linearGradient>
